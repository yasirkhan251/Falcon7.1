<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Tech World - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        :root {
            --bg-dark: #050505;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --blue-glow: #3b82f6;
            --orange-glow: #f97316;
            --error: #ef4444;
            --success: #22c55e;
            --input-bg: #1a1a1a;
        }

        body, html {
            height: 100%; width: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- LAYOUT --- */
        .container { display: flex; height: 100vh; width: 100%; }

        .form-section {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 40px; 
            /* Added a subtle gradient background since the visual side is gone */
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #050505 45%); 
            min-height: 100vh;
            position: relative; z-index: 2;
        }

        .form-wrapper { width: 100%; max-width: 400px; }

        /* --- HEADERS --- */
        .header { margin-bottom: 30px; text-align: center; }
        .header h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 5px; }
        .brand-gradient {
            background: linear-gradient(to right, var(--blue-glow), var(--orange-glow));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin-top: 10px; }

        /* --- INPUTS --- */
        .input-group { margin-bottom: 25px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); margin-left: 5px; }
        
        .input-group input {
            width: 100%; padding: 16px; background: var(--input-bg); 
            border: 1px solid #333; border-radius: 12px;
            color: white; font-size: 1rem; transition: 0.3s;
        }
        
        .input-group input:focus {
            outline: none; border-color: var(--blue-glow);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); background: #111;
        }

        /* --- TOASTS --- */
        .toast-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            max-width: 350px; display: flex; flex-direction: column; gap: 10px;
        }
        .toast-notification {
            background-color: #1a1a1a; color: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: flex; align-items: center;
            border-left: 4px solid var(--blue-glow); animation: toast-slide-in 0.5s forwards;
        }
        .toast-notification.error { border-left-color: var(--error); }
        .toast-notification.success { border-left-color: var(--success); }
        @keyframes toast-slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .toast-fade-out { opacity: 0; transform: translateX(100%); transition: 0.5s; }

        /* --- BUTTONS & LINKS --- */
        .btn-primary {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, var(--blue-glow), var(--orange-glow));
            color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: 0.3s; margin-top: 10px; display: flex; justify-content: center; align-items: center;
        }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; box-shadow: 0 10px 20px rgba(59, 130, 246, 0.2); }

        .back-link {
            display: block; text-align: center; margin-top: 25px;
            color: var(--text-muted); text-decoration: none; font-size: 0.95rem; transition: color 0.3s;
        }
        .back-link:hover { color: white; }

        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<!-- Django Messages Container -->
<div id="serverMessages" style="display:none;">
    {% if messages %}
        {% for message in messages %}
            <div data-level="{{ message.tags }}" data-text="{{ message }}"></div>
        {% endfor %}
    {% endif %}
</div>

<!-- Toast UI Container -->
<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="form-section">
        <div class="form-wrapper fade-in">
            
            <div class="header">
                <h1>Reset Password</h1>
                <p>Enter the email address associated with your <span class="brand-gradient">Falcon Tech</span> account and we'll send you a link to reset your password.</p>
            </div>
            
            <!-- Update the action URL to your Django password reset view -->
            <form id="resetForm" method="POST" action="{% url 'forgot_password' %}" onsubmit="return validateReset(event)">
                {% csrf_token %}
                
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" name="user" placeholder="john@example.com" required>
                </div>

                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>

            <!-- Link back to auth.html -->
            <a href="{% url 'auth' %}" class="back-link">&larr; Back to Login</a>

        </div>
    </div>
</div>

<script>
    const toastContainer = document.getElementById('toastContainer');

    // --- Toast Logic ---
    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast-notification ${type}`;
        toast.innerHTML = `<p>${message}</p>`;
        toastContainer.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('toast-fade-out');
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    // --- Django Messages Logic ---
    document.addEventListener('DOMContentLoaded', () => {
        const serverMessageContainer = document.getElementById('serverMessages');
        if (serverMessageContainer) {
            const messages = serverMessageContainer.querySelectorAll('[data-level]');
            messages.forEach(msg => {
                const levelTag = msg.getAttribute('data-level');
                const text = msg.getAttribute('data-text');
                
                let type = 'info';
                if (levelTag.includes('error')) type = 'error';
                if (levelTag.includes('success')) type = 'success';
                
                showToast(text, type);
            });
        }
    });

    // --- Client Side Validation ---
    function validateReset(event) {
        const email = document.getElementById('resetEmail').value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailRegex.test(email)) {
            event.preventDefault();
            showToast("Please enter a valid email address.", "error");
            return false;
        }
        
        // Optional: show a loading toast while waiting for the server
        showToast("Sending reset link...", "info");
        return true;
    }
</script>

</body>
</html>

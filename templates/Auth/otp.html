<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon Tech World - Verify OTP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & VARIABLES --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        :root {
            --bg-dark: #050505;
            --text-main: #fff;
            --text-muted: #94a3b8;
            --blue: #3b82f6;
            --orange: #f97316;
            --error: #ef4444;
            --success: #22c55e;
            --input-bg: #1a1a1a;
        }

        html, body {
            width: 100%; height: 100%;
            background: var(--bg-dark); color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- LAYOUT --- */
        .container {
            min-height: 100svh; display: flex; align-items: center; justify-content: center;
            padding: 16px; padding-bottom: env(safe-area-inset-bottom);
        }

        .form-wrapper { width: 100%; max-width: 420px; padding: 28px; }

        /* --- HEADERS & PROGRESS --- */
        .header { text-align: center; margin-bottom: 26px; }
        .header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 6px; }
        .header p { color: var(--text-muted); font-size: 0.95rem; }

        .progress-container { margin-bottom: 25px; text-align: center; }
        .progress-text { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
        .progress-bar-bg { width: 100%; background: #222; height: 4px; border-radius: 2px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--blue); width: 50%; transition: width 0.4s ease; }

        /* --- INPUTS --- */
        .otp-box { display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
        .otp-box input {
            width: 48px; height: 56px; text-align: center; font-size: 1.3rem;
            border-radius: 12px; background: #111; border: 1px solid #333; color: #fff; transition: 0.3s;
        }
        .otp-box input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); margin-left: 5px; }
        .input-group input {
            width: 100%; padding: 16px; background: var(--input-bg); 
            border: 1px solid #333; border-radius: 12px;
            color: white; font-size: 1rem; transition: 0.3s;
        }
        .input-group input:focus {
            outline: none; border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); background: #111;
        }

        /* --- BUTTONS --- */
        .btn-primary {
            width: 100%; padding: 16px; border-radius: 12px; border: none;
            background: linear-gradient(90deg, var(--blue), var(--orange));
            color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.95; }

        .btn-secondary {
            width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #333;
            background: #111; color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .btn-secondary:hover { background: #222; }

        .step-buttons { display: flex; gap: 15px; margin-top: 10px; }
        .step-buttons .btn-secondary { flex: 1; }
        .step-buttons .btn-primary { flex: 2; }

        .resend { margin-top: 20px; text-align: center; font-size: 0.95rem; color: var(--text-muted); }
        .resend button { background: none; border: none; color: var(--blue); cursor: pointer; font-weight: 600; font-size: 0.95rem; }

        /* --- TOASTS & UTILS --- */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; max-width: 350px; display: flex; flex-direction: column; gap: 10px; }
        .toast-notification {
            background-color: #1a1a1a; color: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4); display: flex; align-items: center;
            border-left: 4px solid var(--blue); animation: toast-slide-in 0.5s forwards;
        }
        .toast-notification.error { border-left-color: var(--error); }
        .toast-notification.success { border-left-color: var(--success); }
        @keyframes toast-slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .toast-fade-out { opacity: 0; transform: translateX(100%); transition: 0.5s; }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 768px) { .container { min-height: 50svh; } }
    </style>
</head>
<body>

<div id="serverMessages" style="display:none;">
    {% if messages %}
        {% for message in messages %}
            <div data-level="{{ message.tags }}" data-text="{{ message }}"></div>
        {% endfor %}
    {% endif %}
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="form-wrapper">

        <div class="header">
            <h1>Account Recovery</h1>
            <p id="headerDesc">OTP sent to <strong>{{ email }}</strong></p>
        </div>

        <div class="progress-container">
            <div class="progress-text" id="progressText">Step 1 of 2</div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <form id="resetPasswordForm" method="POST" action="{% url 'verify_otp' %}" onsubmit="return validateFinalSubmit(event)">
            {% csrf_token %}
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="hidden" name="mode" value="{{ mode }}">
            <input type="hidden" name="next" value="{{ next }}">
            <input type="hidden" name="otp" id="otpInput">

            <!-- STEP 1: OTP Verification -->
            <div id="step1" class="fade-in">
                <div class="otp-box">
                    <input type="text" maxlength="1" inputmode="numeric" required>
                    <input type="text" maxlength="1" inputmode="numeric" required>
                    <input type="text" maxlength="1" inputmode="numeric" required>
                    <input type="text" maxlength="1" inputmode="numeric" required>
                    <input type="text" maxlength="1" inputmode="numeric" required>
                    <input type="text" maxlength="1" inputmode="numeric" required>
                </div>

                <button type="button" class="btn-primary" onclick="goToStep2()">Verify OTP &rarr;</button>
                
                <div class="resend">
                    Didn’t receive OTP? 
                    <button type="button" onclick="document.getElementById('resendForm').submit();">Resend</button>
                </div>
            </div>

            <!-- STEP 2: Set New Password -->
            <div id="step2" class="hidden fade-in">
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" name="new_password" placeholder="Min. 6 characters">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirm_password" placeholder="Repeat password">
                </div>

                <div class="step-buttons">
                    <button type="button" class="btn-secondary" onclick="goToStep1()">&larr; Back</button>
                    <button type="submit" class="btn-primary">Reset Password</button>
                </div>
            </div>
        </form>

        <!-- Hidden form for resending OTP -->
        <form id="resendForm" method="POST" action="" style="display:none;">
            {% csrf_token %}
            <input type="hidden" name="phone" value="{{ phone }}">
            <input type="hidden" name="mode" value="{{ mode }}">
        </form>

    </div>
</div>

<script>
    const toastContainer = document.getElementById('toastContainer');
    const inputs = document.querySelectorAll(".otp-box input");
    const otpHidden = document.getElementById("otpInput");

    // --- Toast Logic ---
    function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast-notification ${type}`;
        toast.innerHTML = `<p>${message}</p>`;
        toastContainer.appendChild(toast);
        setTimeout(() => {
            toast.classList.add('toast-fade-out');
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }

    // --- Django Messages ---
    document.addEventListener('DOMContentLoaded', () => {
        const serverMessageContainer = document.getElementById('serverMessages');
        if (serverMessageContainer) {
            const messages = serverMessageContainer.querySelectorAll('[data-level]');
            messages.forEach(msg => {
                const levelTag = msg.getAttribute('data-level');
                const text = msg.getAttribute('data-text');
                let type = 'info';
                if (levelTag.includes('error')) type = 'error';
                if (levelTag.includes('success')) type = 'success';
                showToast(text, type);
            });
        }
    });

    // --- OTP Input Handling ---
    inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
            // Only allow numbers
            input.value = input.value.replace(/[^0-9]/g, '');
            if (input.value && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
            updateOTP();
        });
        input.addEventListener("keydown", e => {
            if (e.key === "Backspace" && !input.value && index > 0) {
                inputs[index - 1].focus();
            }
        });
        // Handle Paste
        input.addEventListener('paste', e => {
            e.preventDefault();
            const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 6);
            for (let i = 0; i < pastedData.length; i++) {
                if (inputs[i]) {
                    inputs[i].value = pastedData[i];
                }
            }
            if (pastedData.length > 0) {
                const nextIndex = Math.min(pastedData.length, 5);
                inputs[nextIndex].focus();
            }
            updateOTP();
        });
    });

    function updateOTP() {
        let otp = "";
        inputs.forEach(i => otp += i.value);
        otpHidden.value = otp;
    }

    // --- Flow Logic ---
    function goToStep2() {
        updateOTP();
        if (otpHidden.value.length < 6) {
            showToast("Please enter the complete 6-digit OTP.", "error");
            return;
        }

        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        
        document.getElementById('progressText').innerText = "Step 2 of 2";
        document.getElementById('progressBar').style.width = "100%";
        document.getElementById('headerDesc').innerHTML = "Set your new password securely.";
    }

    function goToStep1() {
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step1').classList.remove('hidden');
        
        document.getElementById('progressText').innerText = "Step 1 of 2";
        document.getElementById('progressBar').style.width = "50%";
        document.getElementById('headerDesc').innerHTML = "OTP sent to <strong>{{ phone }}</strong>";
    }

    // --- Final Submission Validation ---
    function validateFinalSubmit(event) {
        const pass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (pass.length < 6) {
            event.preventDefault();
            showToast("Password must be at least 6 characters.", "error");
            return false;
        }

        if (pass !== confirm) {
            event.preventDefault();
            showToast("Passwords do not match!", "error");
            return false;
        }
        
        return true;
    }
</script>

</body>
</html>
